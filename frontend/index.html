<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income Assessment — Case File</title>
<style>
  :root{
    --ink:#232323;
    --paper:#F3EFE4;
    --paper-line:#d8d0ba;
    --navy:#1B2430;
    --navy-2:#242F3E;
    --gold:#B8892B;
    --gold-light:#E4C170;
    --red-stamp:#8C2F2F;
    --green-stamp:#2F5C3F;
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: Arial, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--navy);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.02), transparent 40%);
    font-family:var(--sans);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  .sheet{
    width:100%;
    max-width:720px;
    background:var(--paper);
    border:1px solid var(--paper-line);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    position:relative;
  }
  .sheet::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--paper-line);
    pointer-events:none;
  }
  header{
    padding:32px 40px 20px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  header .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#6b6250;
  }
  header h1{
    font-family:var(--serif);
    font-size:30px;
    margin:6px 0 0;
    letter-spacing:.01em;
  }
  header .case-no{
    font-family:var(--mono);
    font-size:12px;
    text-align:right;
    color:#6b6250;
    line-height:1.6;
  }
  form{padding:28px 40px 8px;}
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px 24px;
  }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#5b5343;
  }
  .field input, .field select{
    font-family:var(--sans);
    font-size:15px;
    padding:9px 10px;
    background:#fbf9f3;
    border:1px solid #b7ac8e;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(184,137,43,0.25);
  }
  .submit-row{
    margin:26px 0 6px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  button#submitBtn{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:14px 26px;
    cursor:pointer;
    transition:background .15s ease;
  }
  button#submitBtn:hover{background:var(--navy-2);}
  button#submitBtn:disabled{background:#9a9284; cursor:wait;}
  #formError{
    font-family:var(--mono);
    font-size:12px;
    color:var(--red-stamp);
  }
  .result{
    margin:8px 40px 36px;
    border-top:2px dashed var(--paper-line);
    padding-top:24px;
    display:none;
  }
  .result.visible{display:block;}
  .stamp{
    display:inline-block;
    font-family:var(--serif);
    font-weight:bold;
    font-size:22px;
    letter-spacing:.04em;
    padding:8px 18px;
    border:3px solid currentColor;
    transform:rotate(-2deg);
    text-transform:uppercase;
  }
  .stamp.above{color:var(--green-stamp);}
  .stamp.below{color:var(--red-stamp);}
  .probs{
    margin-top:22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .prob-block .prob-label{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#5b5343;
    margin-bottom:6px;
  }
  .prob-bar{
    height:10px;
    background:#e3dcc9;
    border:1px solid #b7ac8e;
    position:relative;
  }
  .prob-fill{
    height:100%;
    background:var(--gold);
  }
  .prob-value{
    font-family:var(--mono);
    font-size:18px;
    margin-top:6px;
  }
  .footnote{
    margin-top:20px;
    font-family:var(--mono);
    font-size:11px;
    color:#6b6250;
  }
  footer{
    padding:14px 40px 28px;
    font-family:var(--mono);
    font-size:10px;
    color:#8a8168;
    letter-spacing:.05em;
  }
</style>
</head>
<body>
  <div class="sheet">
    <header>
      <div>
        <div class="eyebrow">Census Income Assessment</div>
        <h1>Income Case File</h1>
      </div>
      <div class="case-no">
        FORM DT-8/BAL<br>
        REF: <span id="refNum">—</span>
      </div>
    </header>

    <form id="predictForm">
      <div class="grid">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" min="17" max="90" value="35" required>
        </div>
        <div class="field">
          <label for="sex">Sex</label>
          <select id="sex" required>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <div class="field">
          <label for="education">Education</label>
          <select id="education" required></select>
        </div>
        <div class="field">
          <label for="workclass">Work Class</label>
          <select id="workclass" required></select>
        </div>
        <div class="field">
          <label for="maritalStatus">Marital Status</label>
          <select id="maritalStatus" required></select>
        </div>
        <div class="field">
          <label for="relationship">Relationship</label>
          <select id="relationship" required></select>
        </div>
        <div class="field">
          <label for="occupation">Occupation</label>
          <select id="occupation" required></select>
        </div>
        <div class="field">
          <label for="hoursPerWeek">Hours / Week</label>
          <input type="number" id="hoursPerWeek" min="1" max="99" value="40" required>
        </div>
        <div class="field">
          <label for="capitalGain">Capital Gain ($)</label>
          <input type="number" id="capitalGain" min="0" value="0" required>
        </div>
        <div class="field">
          <label for="capitalLoss">Capital Loss ($)</label>
          <input type="number" id="capitalLoss" min="0" value="0" required>
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" id="submitBtn">Assess Case</button>
        <span id="formError"></span>
      </div>
    </form>

    <div class="result" id="resultBlock">
      <div id="stamp" class="stamp">—</div>
      <div class="probs">
        <div class="prob-block">
          <div class="prob-label">P( income &gt; $50K )</div>
          <div class="prob-bar"><div class="prob-fill" id="barAbove" style="width:0%"></div></div>
          <div class="prob-value" id="valAbove">—</div>
        </div>
        <div class="prob-block">
          <div class="prob-label">P( income ≤ $50K )</div>
          <div class="prob-bar"><div class="prob-fill" id="barBelow" style="width:0%"></div></div>
          <div class="prob-value" id="valBelow">—</div>
        </div>
      </div>
      <div class="footnote" id="footnote"></div>
    </div>

    <footer>
      MODEL: DECISION TREE (max_depth=8, balanced) — DATASET: UCI ADULT INCOME — © Sisawo 2026
    </footer>
  </div>

<script>
  // Point this at your deployed backend before shipping.
  const BACKEND_URL = window.BACKEND_URL || "http://localhost:8000";

  const OPTIONS = {
    workclass: ["Private","Self-emp-not-inc","Self-emp-inc","Federal-gov","Local-gov","State-gov","Without-pay","Never-worked"],
    education: ["Preschool","1st-4th","5th-6th","7th-8th","9th","10th","11th","12th","HS-grad","Some-college","Assoc-voc","Assoc-acdm","Bachelors","Masters","Prof-school","Doctorate"],
    maritalStatus: ["Married-civ-spouse","Never-married","Divorced","Separated","Widowed","Married-spouse-absent","Married-AF-spouse"],
    occupation: ["Exec-managerial","Prof-specialty","Craft-repair","Adm-clerical","Sales","Other-service","Machine-op-inspct","Transport-moving","Handlers-cleaners","Farming-fishing","Tech-support","Protective-serv","Priv-house-serv","Armed-Forces"],
    relationship: ["Husband","Wife","Not-in-family","Own-child","Unmarried","Other-relative"],
  };

  function fillSelect(id, values, defaultValue){
    const el = document.getElementById(id);
    el.innerHTML = values.map(v => `<option value="${v}"${v===defaultValue?' selected':''}>${v}</option>`).join('');
  }
  fillSelect('workclass', OPTIONS.workclass);
  fillSelect('education', OPTIONS.education, 'Bachelors');
  fillSelect('maritalStatus', OPTIONS.maritalStatus);
  fillSelect('occupation', OPTIONS.occupation);
  fillSelect('relationship', OPTIONS.relationship);

  document.getElementById('refNum').textContent = Math.floor(100000 + Math.random()*899999);

  const form = document.getElementById('predictForm');
  const submitBtn = document.getElementById('submitBtn');
  const formError = document.getElementById('formError');
  const resultBlock = document.getElementById('resultBlock');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Assessing…';

    const payload = {
      age: Number(document.getElementById('age').value),
      workclass: document.getElementById('workclass').value,
      education: document.getElementById('education').value,
      maritalStatus: document.getElementById('maritalStatus').value,
      occupation: document.getElementById('occupation').value,
      relationship: document.getElementById('relationship').value,
      sex: document.getElementById('sex').value,
      capitalGain: Number(document.getElementById('capitalGain').value),
      capitalLoss: Number(document.getElementById('capitalLoss').value),
      hoursPerWeek: Number(document.getElementById('hoursPerWeek').value),
    };

    try {
      const res = await fetch(`${BACKEND_URL}/predict`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.detail || `Backend returned ${res.status}`);
      }
      const data = await res.json();

      const stamp = document.getElementById('stamp');
      const above = data.probability_above_50k;
      const below = data.probability_at_or_below_50k;

      stamp.textContent = data.prediction === '>50K' ? 'Income Above $50K' : 'Income At/Below $50K';
      stamp.className = 'stamp ' + (data.prediction === '>50K' ? 'above' : 'below');

      document.getElementById('barAbove').style.width = (above*100).toFixed(1) + '%';
      document.getElementById('barBelow').style.width = (below*100).toFixed(1) + '%';
      document.getElementById('valAbove').textContent = (above*100).toFixed(1) + '%';
      document.getElementById('valBelow').textContent = (below*100).toFixed(1) + '%';
      document.getElementById('footnote').textContent =
        `Model trained on the ${data.model_trained_on_split} train/test split.`;

      resultBlock.classList.add('visible');
    } catch (err) {
      formError.textContent = `Could not complete assessment: ${err.message}. Is the backend running at ${BACKEND_URL}?`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Assess Case';
    }
  });
</script>
</body>
</html>
